<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Managing Translator App</title>
<style>
body { background: #0f172a; display: flex; justify-content: center; padding: 20px; font-family: Arial; }
.card { background: #1e293b; width: 100%; max-width: 400px; padding: 25px; border-radius: 20px; }
h2 { color: white; }
textarea, select { width: 100%; padding: 15px; border-radius: 12px; border: none; margin: 10px 0; font-size: 16px; box-sizing: border-box; }
button { width: 100%; padding: 15px; background: #22c55e; color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; }
#out { background: #0f172a; color: white; padding: 15px; border-radius: 12px; margin-top: 15px; min-height: 30px; }
</style>
</head>
<body>
<div class="card">
<h2>Managing Translator App</h2>
<textarea id="t" rows="4">How are you</textarea>
<select id="lang">
<option value="sw">Kiswahili</option>
<option value="en">English</option>
<option value="fr">French</option>
<option value="de">German</option>
<option value="es">Spanish</option>
<option value="ar">Arabic</option>
</select>
<button onclick="go()">Translate</button>
<div id="out"></div>
</div>
<script>
async function go(){
  let text = document.getElementById('t').value;
  let to = document.getElementById('lang').value;
  let out = document.getElementById('out');
  out.innerText = "Translating...";
  let r = await fetch('/translate',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({text: text, to: to})
  });
  let d = await r.json();
  out.innerText = d.translated; // Hapa ndio ilikuwa inakosea
}
</script>
</div>
</body>
</html>
