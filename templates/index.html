<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Translator App</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        .box { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 10px; }
        textarea, select, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ddd; }
        button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
        #output { background: #e9ecef; padding: 15px; border-radius: 8px; min-height: 50px; margin-top: 10px; }
    </style>
</head>
<body>
<div class="box">
    <h2>Translator</h2>
    <textarea id="inputText" placeholder="Andika hapa... Example: How are you"></textarea>
    
    <select id="lang">
        <option value="sw">Swahili</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="es">Spanish</option>
        <option value="ar">Arabic</option>
        <option value="zh">Chinese</option>
        <option value="en">English</option>
    </select>
    
    <button onclick="doTranslate()">Translate</button>
    
    <div id="output">Translation itaonekana hapa...</div>
</div>

<script>
async function doTranslate() {
    const text = document.getElementById('inputText').value;
    const to = document.getElementById('lang').value;
    const output = document.getElementById('output');
    
    if(!text) { output.innerText = "Andika kitu kwanza!"; return; }
    
    output.innerText = "Inatranslate...";
    
    try {
        const res = await fetch('/translate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: text, to: to })
        });
        
        const data = await res.json();
        output.innerText = data.translated;
        console.log(data); // kwa debugging
        
    } catch (err) {
        output.innerText = "Error: " + err.message;
    }
}
</script>
</body>
</html>
